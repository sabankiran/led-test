<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 BLE Tartı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; text-align: center; padding: 20px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { color: #37474f; margin-bottom: 5px; }
        .status { font-size: 14px; color: #78909c; margin-bottom: 20px; font-weight: bold; }
        
        .weight-box { background: #e3f2fd; padding: 20px; border-radius: 15px; margin: 15px 0; }
        .weight-val { font-size: 58px; font-weight: bold; color: #1565c0; line-height: 1; }
        .unit { font-size: 22px; color: #42a5f5; }
        .raw-val { font-size: 13px; color: #78909c; margin-top: 10px; font-family: monospace; }
        
        .btn { border: none; padding: 14px 20px; font-size: 16px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; transition: 0.2s; }
        .btn-connect { background: #0288d1; color: white; }
        .btn-tare { background: #ff9800; color: white; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>BLE Dijital Tartı</h2>
    <div id="status" class="status">Bağlantı Bekleniyor...</div>

    <div class="weight-box">
        <div class="weight-val"><span id="weight">0.0</span> <span class="unit">g</span></div>
        <div class="raw-val">Ham Veri (Raw): <span id="raw">0</span></div>
    </div>

    <button id="btnConnect" class="btn btn-connect" onclick="connectBLE()">Bluetooth Cihazları Tara & Bağlan</button>
    <button id="btnTare" class="btn btn-tare" onclick="sendTare()">DARA AL (SIFIRLA)</button>
</div>

<script>
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    let bleCharacteristic;

    async function connectBLE() {
        try {
            document.getElementById('status').innerText = "Aranıyor...";
            
            // Tüm Bluetooth cihazlarını listeler (Filtre kısıtlaması yok)
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            document.getElementById('status').innerText = "Bağlanıyor...";
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // Veri Akışını Başlat
            await bleCharacteristic.startNotifications();
            bleCharacteristic.addEventListener('characteristicvaluechanged', handleData);

            document.getElementById('status').innerText = "Bağlandı: " + (device.name || "ESP32 Tartı");
            document.getElementById('status').style.color = "#2e7d32";
            document.getElementById('btnConnect').style.display = "none";
            document.getElementById('btnTare').style.display = "block";

            device.addEventListener('gattserverdisconnected', onDisconnected);

        } catch (error) {
            document.getElementById('status').innerText = "Hata: " + error;
            document.getElementById('status').style.color = "#c62828";
        }
    }

    function handleData(event) {
        let decoder = new TextDecoder('utf-8');
        let rawString = decoder.decode(event.target.value); // Örn: "125.4|8452100"
        
        let parts = rawString.split('|');
        if (parts.length === 2) {
            document.getElementById('weight').innerText = parts[0];
            document.getElementById('raw').innerText = parts[1];
        }
    }

    async function sendTare() {
        if (bleCharacteristic) {
            let encoder = new TextEncoder('utf-8');
            await bleCharacteristic.writeValue(encoder.encode("TARE"));
        }
    }

    function onDisconnected() {
        document.getElementById('status').innerText = "Bağlantı Kesildi!";
        document.getElementById('status').style.color = "#c62828";
        document.getElementById('btnConnect').style.display = "block";
        document.getElementById('btnTare').style.display = "none";
        document.getElementById('weight').innerText = "0.0";
        document.getElementById('raw').innerText = "0";
    }
</script>

</body>
</html>
