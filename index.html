<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 Dijital Tartı</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eceff1; text-align: center; padding: 20px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #37474f; margin-bottom: 5px; }
        .status { font-size: 14px; color: #78909c; margin-bottom: 25px; font-weight: bold; }
        .weight-display { font-size: 64px; font-weight: bold; color: #1e88e5; margin: 20px 0; background: #e3f2fd; padding: 20px; border-radius: 15px; }
        .unit { font-size: 24px; color: #5c6bc0; }
        .btn { border: none; padding: 15px 25px; font-size: 18px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; transition: 0.2s; }
        .btn-connect { background: #4caf50; color: white; }
        .btn-tare { background: #ff9800; color: white; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>BLE Dijital Tartı</h2>
    <div id="status" class="status">Bağlantı Bekleniyor...</div>

    <div class="weight-display">
        <span id="weight">0</span> <span class="unit">g</span>
    </div>

    <button id="btnConnect" class="btn btn-connect" onclick="connectBLE()">Tartıya Bağlan</button>
    <button id="btnTare" class="btn btn-tare" onclick="sendTare()">DARA AL (SIFIRLA)</button>
</div>

<script>
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    let bleCharacteristic;

    async function connectBLE() {
        try {
            document.getElementById('status').innerText = "Cihaz Aranıyor...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32C3-Tarti' }],
                optionalServices: [SERVICE_UUID]
            });

            document.getElementById('status').innerText = "Bağlanıyor...";
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // Bildirimleri (Notification) Başlat
            await bleCharacteristic.startNotifications();
            bleCharacteristic.addEventListener('characteristicvaluechanged', handleWeightData);

            document.getElementById('status').innerText = "Bağlandı: " + device.name;
            document.getElementById('status').style.color = "#2e7d32";
            document.getElementById('btnConnect').style.display = "none";
            document.getElementById('btnTare').style.display = "block";

            device.addEventListener('gattserverdisconnected', onDisconnected);

        } catch (error) {
            document.getElementById('status').innerText = "Hata: " + error;
            document.getElementById('status').style.color = "#c62828";
        }
    }

    function handleWeightData(event) {
        let decoder = new TextDecoder('utf-8');
        let weightVal = decoder.decode(event.target.value);
        document.getElementById('weight').innerText = weightVal;
    }

    async function sendTare() {
        if (bleCharacteristic) {
            let encoder = new TextEncoder('utf-8');
            await bleCharacteristic.writeValue(encoder.encode("TARE"));
        }
    }

    function onDisconnected() {
        document.getElementById('status').innerText = "Bağlantı Kesildi!";
        document.getElementById('status').style.color = "#c62828";
        document.getElementById('btnConnect').style.display = "block";
        document.getElementById('btnTare').style.display = "none";
        document.getElementById('weight').innerText = "0";
    }
</script>

</body>
</html>
